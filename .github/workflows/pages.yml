name: Pages

# Publishes web/ to GitHub Pages. The site is static and committed, so there is
# no build: what is in git is what goes live, and there is no build step to fail.
# Manual only. GitHub Pages has never been enabled on this repository, so the
# push trigger failed on every commit that touched web/ -- `configure-pages`
# cannot find a Pages site and exits non-zero. A workflow that fails every time
# is worse than no workflow: it trains everyone to ignore a red mark.
#
# To turn it back on: enable Pages under Settings -> Pages -> Source: GitHub
# Actions, run this once from the Actions tab to confirm it works, then restore
# the push trigger below.
#
#  push:
#    branches: [main]
#    paths: ["web/**", ".github/workflows/pages.yml"]
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
