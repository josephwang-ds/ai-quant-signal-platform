server {
    listen 80;
    listen [::]:80;
    server_name company-lens.example.com;

    root /opt/company-lens/data/build/company_pages;
    index index.html;

    location / {
        try_files $uri $uri/ /404.html;
    }

    location ~* \.(?:html|json)$ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri /404.html;
    }

    access_log /var/log/nginx/company-lens.access.log;
    error_log /var/log/nginx/company-lens.error.log;
}
