[project]
name = "filing-triage"
version = "0.1.0"
description = "Point-in-time SEC filing triage: which disclosures deserve a human read?"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pyarrow>=15.0",
    "requests>=2.31",
    "lxml>=5.0",          # pandas.read_html, for scripts/build_universe.py
    "yfinance>=0.2.40",   # primary daily price source
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
triage = "filing_triage.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]
