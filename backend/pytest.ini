[pytest]
markers =
    live: tests requiring real external network or live market-data providers (excluded from default CI)
addopts = -m "not live" --strict-markers
filterwarnings =
    # Precise third-party / environment filters only — never ignore-all.
    ignore:.*LibreSSL.*:urllib3.exceptions.NotOpenSSLWarning
    ignore:The default value of `allowed_objects` will change:langchain_core._api.deprecation.LangChainPendingDeprecationWarning
    ignore:Features \[.*\] are constant\.:UserWarning:sklearn.feature_selection._univariate_selection
    ignore:invalid value encountered in divide:RuntimeWarning:sklearn.feature_selection._univariate_selection
    ignore:divide by zero encountered in matmul:RuntimeWarning:sklearn
    ignore:overflow encountered in matmul:RuntimeWarning:sklearn
    ignore:invalid value encountered in matmul:RuntimeWarning:sklearn
    ignore:Maximum Likelihood optimization failed to converge:statsmodels.tools.sm_exceptions.ConvergenceWarning
    ignore:X does not have valid feature names, but LGBMClassifier was fitted with feature names:UserWarning:sklearn.utils.validation
    ignore:'parseString' deprecated.*:DeprecationWarning:matplotlib
    ignore:'resetCache' deprecated.*:DeprecationWarning:matplotlib
    ignore:'oneOf' deprecated.*:DeprecationWarning:matplotlib
    ignore:Could not find the number of physical cores.*:UserWarning:joblib
    # Escalate project-owned RuntimeWarnings (module path under app.*).
    error::RuntimeWarning:app
testpaths = tests
