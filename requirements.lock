# Pinned environment, generated by `make lock` from a working install.
#
# The dependency floors in pyproject.toml are `>=`, which is right for a library
# and wrong for a result: two installs a year apart run the same code on
# different numerics, and HistGradientBoostingClassifier does not promise
# identical splits across scikit-learn versions. This file is what a rerun
# should install to get the committed evidence back.
#
#   python -m pip install -r requirements.lock
#
# pyproject.toml stays the source of truth for what the project *depends on*;
# this file records one resolution of it that is known to reproduce.
#
# Regenerate with `make lock` after deliberately upgrading something, and expect
# the numbers in evidence/real_run to be re-exported in the same commit --
# manifest.json records the environment each result was produced on.
#
# This includes the optional [nlp] and [ts] stacks, torch among them, which makes
# the install large. That is deliberate: `nlp_feature_ablation.csv` and the
# volatility tables cannot be reproduced without them, and a lock file that
# cannot reproduce two of the committed results is not doing the job this header
# claims. To run the project rather than reproduce its evidence, `pip install -e .`
# needs none of it -- the transformer and forecaster paths are optional
# throughout, and everything else behaves identically without them.
#
